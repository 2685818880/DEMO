version: '3'
services:
  elasticsearch:
    restart: always
    image: elasticsearch:8.7.0
    container_name: elasticsearch
    environment:
      - "cluster.name=elasticsearch" #设置集群名称为elasticsearch
      - "discovery.type=single-node" #以单一节点模式启动
      - "ES_JAVA_OPTS=-Xms512m -Xmx1024m" #设置使用jvm内存大小
      - "bootstrap.memory_lock=true"
    volumes:
      - ../../../../mydata/elasticsearch/plugins:/usr/share/elasticsearch/plugins #插件文件挂载
      - ../../../../mydata/elasticsearch/data:/usr/share/elasticsearch/data #数据文件挂载
      - ./ELKConfig/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    ports:
      - 9200:9200
      - 9300:9300
  kibana:
    restart: always
    image: kibana:8.7.0
    container_name: kibana
    volumes:
      - ./ELKConfig/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
    links:
      - elasticsearch:es #可以用es这个域名访问elasticsearch服务
    depends_on:
      - elasticsearch #kibana在elasticsearch启动之后再启动
    environment:
      - "elasticsearch.hosts=http://es:9200" #设置访问elasticsearch的地址
    ports:
      - 5601:5601
  logstash:
    restart: always
    image: logstash:8.7.0
    container_name: logstash
    volumes:
      - ./ELKConfig/logstash/logstash-springboot.conf:/usr/share/logstash/pipeline/logstash.conf #挂载logstash的配置文件
    depends_on:
      - elasticsearch #kibana在elasticsearch启动之后再启动
    links:
      - elasticsearch:es #可以用es这个域名访问elasticsearch服务
    ports:
      - 4560:4560
  redis:
    restart: always
    image: redis:latest
    container_name: redis00
    ports:
      - 6379:6379
